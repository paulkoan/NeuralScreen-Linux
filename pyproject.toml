[project]
name = "neuralscreen-linux"
version = "0.1.0"
description = "Linux port of NeuralScreen — DLSS5 neural rendering on your desktop via Wine+VKD3D"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pygame>=2.5",
    "av>=12",
    "mss>=9",
    "pysdl2>=0.9",
    # Wayland capture: pure Python D-Bus with file-descriptor passing, for the
    # XDG Desktop Portal ScreenCast handshake. Chosen over dbus-python (needs
    # libdbus headers to build) and over PyGObject (needs gobject-introspection).
    "jeepney>=0.8",
]

[dependency-groups]
# PEP 735 dev group. Wanted rather than an optional-dependency extra because
# `uv sync` and `uv run` install dependency groups by default: pytest is then
# simply there, and every command works without a `--extra test` flag that is
# easy to forget and produces a confusing failure when it is.
dev = ["pytest>=8"]

[tool.uv]
native-tls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import protocol.py and minimal/ from the repo root, so the root has
# to be on sys.path. conftest.py adds it too; this keeps plain `pytest` working.
pythonpath = ["."]
addopts = "-ra"
# tests/test_m0_env_gate.py is skipped unless NX_RUN_M0=1 is set: it needs the
# GPU box, Wine and the 159 MB NVIDIA runtime, none of which exist in CI.
filterwarnings = [
    "ignore::DeprecationWarning:mss",
]
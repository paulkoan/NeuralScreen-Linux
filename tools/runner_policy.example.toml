# The auto-runner's policy. Install this OUTSIDE the repository, in /opt/neuralscreen:
#
#   install -d -m 0755 /opt/neuralscreen /opt/neuralscreen/state
#   install -m 0644 tools/runner_policy.example.toml /opt/neuralscreen/policy.toml
#   $EDITOR /opt/neuralscreen/policy.toml                    # the entries, if you want fewer
#
# No root, and nothing in /etc: the runner is a systemd USER unit reading this file. The
# unit's sandbox - not a privileged install - is what bounds a run (see
# tools/neuralscreen-runner.service).
#
# It has to live outside the repo because it is the thing that decides what may run: if it
# were versioned, a commit could name a new entry point and grant itself the machine. This
# copy, in /opt/neuralscreen, is the one that counts.
#
# Everything below is a starting point. The entries are the whole of what this runner will
# execute; a request naming anything else is refused and the refusal is pushed like any
# other result.

repo_url = "git@github.com:paulkoan/NeuralScreen-Linux.git"
# SSH with a deploy key scoped to this one repository, not a token: the runner only ever
# pushes one branch, and a key can be revoked without touching anything else you have.
# The key is generated ON THE MACHINE THAT USES IT (the private half never travels) and
# lives at /opt/neuralscreen/deploy_key, mode 0600, owned by you and read by nothing else.
# GIT_SSH_COMMAND pointing at it is set in the unit - see neuralscreen-runner.service.
worktree = "/opt/neuralscreen/state/repo"        # the runner's OWN clone, not your checkout
request_branch = "main"                          # run requests come from here
results_branch = "results"                       # results go here, and only the runner writes it
max_timeout_s = 900
default_timeout_s = 300
pause_file = "/opt/neuralscreen/PAUSE"           # touch this and nothing runs

# Runs happen directly as you, inside the user unit's sandbox - no sudo, no system files, no
# container. That is the default because the container needs nvidia-container-toolkit, which
# is a system package, and you asked for nothing in /etc.
#
# If you ever want the stronger bound (checkout read-only, one writable directory, no
# network at all), build tools/runner_container/Dockerfile somewhere outside the repo, point
# podman at a user-level CDI spec, and flip this to true. Until then `container = false` is
# the honest description of what runs: this user, these files, this sandbox.
container = false
# image = "localhost/neuralscreen-runner:1"
# device = "nvidia.com/gpu=all"

# Everything the runner is allowed to run. argv is a prefix; a request supplies the rest as
# a list of strings and they go to execve as they are - there is no shell at any point.
[[entry]]
name = "minimal"
argv = ["uv", "run", "python", "-m", "minimal"]
description = "the MVP pipeline, fed a fixture: --source image requires --input-image"
# Machine properties belong here rather than in a commit. Point this at the native port built
# on this machine; leave it out to run the Wine worker instead.
[entry.env]
# Both paths are staged copies under /opt/neuralscreen, not the developer's dev tree - which
# is what lets the unit say ProtectHome=yes and stops a run reading the home directory.
# Install the policy only AFTER the copies exist:
#   cp -a /home/paul/dev/OpenDLSS-NR /opt/neuralscreen/port
#   cp -a /home/paul/dev/odl-model   /opt/neuralscreen/model
NS_WORKER_CMD = "/opt/neuralscreen/port/build/dlss5vk serve --model /opt/neuralscreen/model"

[[entry]]
name = "pytest"
argv = ["uv", "run", "pytest", "tests/", "-q"]
description = "the test suite"

# Apply the current patch to the staged port and rebuild the worker. This is what keeps a
# run from reporting OUT OF SYNC: a port change is a patch plus a build, and the rebuild
# script ends by asking the new binary which patch it carries. It defaults to
# /opt/neuralscreen/port - the staged copy, which is what NS_WORKER_CMD points at - so the
# entry takes no arguments and the runner's own sandbox (ReadWritePaths=/opt/neuralscreen)
# is the whole of what it can touch.
[[entry]]
name = "port-build"
argv = ["bash", "experiments/opendlss_port/rebuild.sh"]
description = "apply the port patch to the staged copy and rebuild dlss5vk"

[[entry]]
name = "m1-gate"
argv = ["bash", "tools/m1_pipeline_gate.sh"]
description = "the M1 gate; needs the screen-cast dialog, so it is not for unattended runs"

# A fixture-driven run looks like this (see runs/README.md):
#
#   {"id": "r2026-10-12-a", "entry": "minimal",
#    "args": ["--input-image", "fixtures/youtube-1440p.png", "--headless",
#             "--frames", "60", "--worker-log", "--shm", "--no-motion", "--send-ahead", "2"],
#    "timeout_s": 300, "artifacts": ["before.png", "after.png"],
#    "note": "does the loop now sit under 60ms?"}

# Before the first run, prime the virtualenv in the runner's own clone (as you, once - the
# service can only reach GitHub, so it can never populate one itself):
#
#   cd /opt/neuralscreen/state/repo && uv sync
#
# A fixture-driven request then looks like:
#
#   {"id": "r2026-10-12-a", "entry": "minimal",
#    "args": ["--source", "image", "--input-image", "fixtures/youtube-1440p.png",
#             "--headless", "--frames", "60", "--worker-log", "--shm", "--no-motion",
#             "--send-ahead", "2"],
#    "timeout_s": 300, "artifacts": ["before.png", "after.png"],
#    "note": "does the loop now sit under 60ms?"}
